# Exomiser genome analysis for PROBAND01. vcf/output paths are filled in by
# scripts/pipeline/30_exomiser.sh (placeholders __VCF__ / __OUT__).
---
analysis:
  genomeAssembly: hg38
  vcf: __VCF__
  ped:
  proband: WGS_EX2312012
  # From Challenge_Clinical_Phenotype_1.docx
  hpoIds: ['HP:0002859', 'HP:0000121', 'HP:0004322', 'HP:0001508',
           'HP:0003202', 'HP:0001622', 'HP:0001518', 'HP:0200067']
  inheritanceModes: {
    AUTOSOMAL_DOMINANT: 0.1,
    AUTOSOMAL_RECESSIVE_HOM_ALT: 0.1,
    AUTOSOMAL_RECESSIVE_COMP_HET: 2.0,
    X_DOMINANT: 0.1,
    X_RECESSIVE_HOM_ALT: 0.1,
    X_RECESSIVE_COMP_HET: 2.0,
    MITOCHONDRIAL: 0.2
  }
  analysisMode: PASS_ONLY
  frequencySources: [
    UK10K,
    GNOMAD_E_AFR, GNOMAD_E_AMR, GNOMAD_E_ASJ, GNOMAD_E_EAS, GNOMAD_E_FIN, GNOMAD_E_NFE, GNOMAD_E_SAS,
    GNOMAD_G_AFR, GNOMAD_G_AMR, GNOMAD_G_ASJ, GNOMAD_G_EAS, GNOMAD_G_FIN, GNOMAD_G_NFE, GNOMAD_G_SAS
  ]
  pathogenicitySources: [REVEL, MVP, ALPHA_MISSENSE, SPLICE_AI]
  steps: [
    failedVariantFilter: {},
    frequencyFilter: { maxFrequency: 2.0 },
    pathogenicityFilter: { keepNonPathogenic: true },
    inheritanceFilter: {},
    omimPrioritiser: {},
    hiPhivePrioritiser: {}
  ]
outputOptions:
  outputContributingVariantsOnly: false
  numGenes: 0
  outputDirectory: __OUT__
  outputFileName: PROBAND01_exomiser_genome
  outputFormats: [HTML, JSON, TSV_GENE, TSV_VARIANT]
